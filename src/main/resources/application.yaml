spring:
  application:
    name: Tukk_Tak

  # ===== Database (MySQL) =====
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tukktak}?characterEncoding=UTF-8&useUnicode=true&serverTimezone=Asia/Seoul
    username: ${MYSQL_USERNAME:tukktak}
    password: ${MYSQL_PASSWORD:tukktak}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true

  # ===== Flyway =====
  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration

# ===== Redis / MongoDB (Spring Data 설정) =====
  data:
    # ----- Redis (로그인 refresh token, 로그아웃 블랙리스트, 인증 캐시) -----
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:true}
    # ----- MongoDB -----
    mongodb:
      auto-index-creation: true

  # ===== 메일 발송 (이메일 인증번호) =====
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}          # Gmail 앱 비밀번호 (공백 없이 16자)
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000  # 서버 연결 5초
      mail.smtp.timeout: 5000            # 응답 대기 5초
      mail.smtp.writetimeout: 5000       # 전송 5초

  # ===== 파일 업로드 (용량 제한) =====
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  # ===== JWT (로그인 인증) =====
jwt:
  secret: ${JWT_SECRET}                 # 32바이트 이상, 기본값 없음 (환경변수 필수)
  access-token-validity: 1800000        # 30분(ms)
  refresh-token-validity: 1209600000    # 14일(ms)
  refresh-token-session-validity: 86400000        # 체크 안 함: 1일(ms)

app:
  # ===== MongoDB 접속 URI =====
  mongo:
    uri: ${MONGODB_URI:mongodb://${MONGO_USERNAME:tukktak}:${MONGO_PASSWORD:tukktak}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:tukktak}?authSource=${MONGO_DATABASE:tukktak}}
    database: ${MONGO_DATABASE:tukktak}

  # ===== 로그인 쿠키 (refresh token) =====
  cookie:
    secure: ${COOKIE_SECURE:true}       # 로컬 http 테스트 때만 false
    domain: ${COOKIE_DOMAIN:}

  # ===== CORS (프론트 도메인) =====
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}   # 쉼표로 여러 개

  # ===== 관리자 계정 (환경변수가 있으면 최초 기동 시 1회 생성) =====
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}        # 64자 이하

  # ==== 국세청 사업자등록정보 진위확인 API (공공데이터포털) ====
  nts:
    service-key: ${NTS_SERVICE_KEY:}
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
    connect-timeout: 3s    # 연결 제한 시간
    read-timeout: 5s       # 응답 제한 시간

  # ==== 구글 로그인 ====
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

  # ===== AWS S3 (이미지) =====
cloud:
  aws:
    region: ap-northeast-2
    s3:
      community-bucket: tukktak-bucket
    cloudfront:
      domain: https://d2hgd0fvvrj50a.cloudfront.net

